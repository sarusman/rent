name: CI - Build, Test & Push Docker Image

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:

  python-quality:
    name: Python Quality (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install quality tools
        run: pip install flake8 black

      - name: Lint with flake8
        run: |
          cd MyService
          flake8 app/ tests/

      - name: Check formatting with black
        run: |
          cd MyService
          black --check app/ tests/

  python-tests:
    name: Python Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd MyService
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          cd MyService
          pytest tests/ \
            --junitxml=test-results.xml \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: MyService/test-results.xml

      - name: Upload Python coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: MyService/coverage.xml

  java-sonar:
    name: Java Build, Test & SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Make gradlew executable
        run: chmod +x MyService/gradlew

      - name: Checkstyle, Tests, JaCoCo & SonarCloud
        working-directory: ./MyService
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew checkstyleMain checkstyleTest test sonar

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ python-quality, python-tests, java-sonar ]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sarusman/myservice:latest -f MyService/Dockerfile MyService/

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: docker push sarusman/myservice:latest
